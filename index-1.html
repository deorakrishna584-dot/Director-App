body{margin:0;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:130px}
@media(min-width:520px){body{padding-block:16px}.app{border-radius:28px;border:1px solid var(--bd);min-height:calc(100vh - 32px)}}
header.bar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;position:relative}
.logo{width:42px;height:42px;border-radius:12px;background:var(--acc);display:grid;place-items:center;font-size:22px;flex:none}
.bar .nm{min-width:0;flex:1}.bar b{display:block;font-size:16px;letter-spacing:-.01em}.bar small{display:block;color:#b9b5ab;font-size:11.5px}
.chip{border:1px solid #4a4a4a;background:#262626;color:#fff;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.hero{background:radial-gradient(120% 90% at 85% 0%,rgba(232,84,30,.28),transparent 55%),linear-gradient(165deg,var(--hero2),#141414);color:#fff;padding:22px 16px 20px}
.hero .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#ff8a57}
.hero h1{margin:6px 0 4px;font-size:24px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;color:#cfcac0;font-size:13px}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero.risk{text-align:center}.hero.risk .row{justify-content:center}
.status{background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status b{font-size:17px}.status small{display:block;color:#b9b5ab;font-size:12px}
.pill{display:inline-block;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.Low{background:var(--lo-bg);color:var(--lo)}.pill.Medium{background:var(--me-bg);color:var(--me)}.pill.High{background:var(--hi-bg);color:var(--hi)}
.pill.acc{background:var(--acc);color:#fff}.pill.ghost{border:1px solid #4a4a4a;color:#fff;background:#262626;font-weight:600}
.pill.big{font-size:17px;padding:9px 22px}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:4px 0 -4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 14px 14px;text-align:left;cursor:pointer;color:var(--tx);font:inherit;min-width:0}
.tile i{display:block;width:26px;height:4px;border-radius:4px;margin-bottom:10px}
.tile .em{font-size:26px;display:block;margin-bottom:8px}
.tile b{display:block;font-size:14px;line-height:1.25}.tile span.s{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.tile .new{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);padding:3px 8px;border-radius:99px}
.banner{background:linear-gradient(100deg,#222 55%,#555);color:#fff;border-radius:20px;padding:16px;cursor:pointer;border:0;text-align:left;font:inherit;width:100%}
.banner h3{margin:8px 0 4px;font-size:18px;line-height:1.2}.banner p{margin:0;color:#cfcac0;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.card.pd{padding:16px}.card h3{margin:0 0 6px;font-size:15px}
.card.dark{background:var(--ink);color:#fff;border-color:var(--ink);padding:16px}.card.dark p{color:#cfcac0;margin:6px 0 10px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.li .dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.Low{background:var(--lo)}.dot.Medium{background:var(--me)}.dot.High{background:var(--hi)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:14px}.li .t small{color:var(--mut);font-size:12px}
.li.click{cursor:pointer}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--bd);border-radius:14px;font:inherit;font-size:15px;background:var(--soft);color:var(--tx)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{width:100%;border:0;border-radius:16px;padding:15px 16px;font:inherit;font-weight:800;font-size:15px;background:var(--btn);color:var(--btn-tx);cursor:pointer;margin-top:14px}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.prog{display:flex;gap:6px}.prog i{flex:1;height:5px;border-radius:5px;background:var(--soft)}.prog i.on{background:var(--acc)}
.stepname{font-size:12px;color:var(--mut);font-weight:700}
.q{padding:14px 0;border-bottom:1px solid var(--bd)}.q:last-of-type{border:0}
.q p{margin:0 0 4px;font-weight:600;font-size:14px}.q small{display:block;color:var(--mut);font-size:12px;margin-bottom:6px}
.opts{display:flex;gap:8px;margin-top:8px}
.opts button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.opts button.on{background:var(--btn);color:var(--btn-tx);border-color:var(--btn)}
.alert{padding:14px;border-bottom:1px solid var(--bd)}.alert:last-child{border:0}
.alert .h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.alert .h b{font-size:14.5px;line-height:1.3}
.alert dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12.5px}.alert dt{color:var(--mut);font-weight:700}.alert dd{margin:0}
.sec-pill{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}.chips button.on{background:var(--btn);color:var(--btn-tx);border-color:var(--btn)}
.dutycard{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.dutycard .top{display:flex;justify-content:space-between;gap:8px;align-items:center}.dutycard .cat{font-size:11.5px;font-weight:700;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:3px 10px}
.dutycard p{margin:0}
.step{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--bd)}.step:last-child{border:0}
.num{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.step b{display:block;font-size:14.5px}.step p{margin:2px 0 4px;color:var(--mut);font-size:13px}.step em{font-style:normal;font-weight:800;color:var(--acc);font-size:12px}
.doc{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}.doc:last-child{border:0}.doc .ic{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.doc b{display:block;font-size:14px}.doc small{font-weight:700;font-size:12px}.doc small.m{color:var(--hi)}.doc small.o{color:var(--me)}
.disc{background:var(--me-bg);color:var(--tx);border-radius:14px;padding:12px 14px;font-size:12.5px}
.err{color:var(--hi);font-size:13px;font-weight:700;margin-top:10px}
ul.pl{margin:0;padding-left:18px}ul.pl li{margin:6px 0;font-size:13.5px}
nav{position:fixed;bottom:var(--navoff,0px);left:50%;transform:translateX(-50%);width:min(100%,480px);background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;min-width:0}
nav button.on{color:var(--acc);font-weight:800}
@media(prefers-reduced-motion:no-preference){.tile,.banner,.btn{transition:transform .12s}.tile:active,.banner:active,.btn:active{transform:scale(.98)}}
.eye{font-size:14px;color:#cfcac0;white-space:nowrap}.more{border:1px solid #4a4a4a;background:#262626;color:#fff;border-radius:12px;width:42px;height:38px;font-size:20px;line-height:1;cursor:pointer;flex:none}.menu{position:absolute;right:16px;top:64px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;overflow:hidden;z-index:20;min-width:170px}.menu[hidden]{display:none}.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--bd)}.menu button:last-child{border:0}
</style>

</div>
<nav id="nav"></nav>
<script>
/* ---------- Questions ---------- */
const Q=[
{id:'q_int',sec:'Conflict & Disclosure',t:'Do you (or a director) have a direct or indirect interest in this transaction — including through a firm/company where a director holds >2% or is promoter/manager/CEO?'},
{id:'q_rel',sec:'Conflict & Disclosure',t:'Is a relative of a director interested, or is the counterparty a relative?'},
{id:'q_disc',sec:'Conflict & Disclosure',t:'Has the interest been disclosed in writing to the Board (Form MBP-1 / s.184 notice)?',show:a=>a.q_int==='y'||a.q_rel==='y'},
{id:'q_abst',sec:'Conflict & Disclosure',t:'Will the interested director(s) stay out of the discussion and the vote?',show:a=>a.q_int==='y'||a.q_rel==='y'},
{id:'q_rpt',sec:'Related Party & Approvals',t:'Is the counterparty a "related party" under s.2(76)?',h:'E.g. director, KMP, relative, firm/company with a director interest, holding/subsidiary/associate company.'},
{id:'q_alp',sec:'Related Party & Approvals',t:'Is the transaction in the ordinary course of business AND on arm\'s length terms?',show:a=>a.q_rpt==='y'},
{id:'q_ac',sec:'Related Party & Approvals',t:'Has the Audit Committee approved it (where the company is required to have one)?',show:a=>a.q_rpt==='y'},
{id:'q_thr',sec:'Related Party & Approvals',t:'Does the value cross the Rule 15 thresholds (e.g. 10% of turnover / net worth, or the ₹ limits)?',h:'Check the latest Companies (Meetings of Board and its Powers) Rules, 2014.',show:a=>a.q_rpt==='y'},
{id:'q_sr',sec:'Related Party & Approvals',t:'Is a special resolution passed/planned (related parties not voting)?',show:a=>(a.q_rpt==='y'&&a.q_thr==='y')||a.q_180==='y'},
{id:'q_180',sec:'Related Party & Approvals',t:'Does it involve sale of an undertaking, borrowing beyond limits, or another s.180 matter?'},
{id:'q_loan',sec:'Related Party & Approvals',t:'Does it involve a loan, guarantee, security or investment (ss.185/186)?'},
{id:'q_notice',sec:'Information & Judgment',t:'Were notice, agenda and notes sent at least 7 days before the meeting (s.173(3), SS-1)?'},
{id:'q_docs',sec:'Information & Judgment',t:'Do you have enough information (documents, valuation, financials, legal opinion) to decide?'},
{id:'q_indep',sec:'Information & Judgment',t:'Are you deciding independently, free of pressure from promoters/management?'},
{id:'q_gain',sec:'Information & Judgment',t:'Will any director, relative or associate get an undue gain or advantage?'},
{id:'q_care',sec:'Information & Judgment',t:'Have you questioned management / taken professional advice where needed?'},
{id:'q_quorum',sec:'Information & Judgment',t:'Is the meeting validly convened with quorum (ss.173–174)?'}
];
const TYPES=['Purchase/sale of goods','Sale/purchase of property','Loan / guarantee / investment','Service contract','Appointment to office of profit','Borrowing / sale of undertaking','Other'];
const RELS=['None – unrelated party','Director','Relative of director','Firm/company of director or relative','KMP / their relative','Holding / subsidiary / associate','Other'];

/* ---------- Rule engine ---------- */
function evaluate(a,d){
 const out=[];const add=(risk,issue,law,req,act)=>out.push({risk,issue,law,req,act});
 const Y=k=>a[k]==='y',N=k=>a[k]==='n';
 const gap=(k,hi,msg,law,req,act)=>{ if(a[k]===hi.bad) add(hi.risk,msg,law,req,act); else if(a[k]==='u') add('Medium','Unverified: '+msg,law,req,'Verify this point with the Company Secretary/legal counsel before voting.');};
 if(Y('q_int')||Y('q_rel')){
  const ok=Y('q_disc')&&Y('q_abst');
  add(ok?'Medium':'High','Conflict of interest identified','ss.184, 166(4)','Interested director must disclose and not participate in the discussion/vote on the contract.',ok?'Record disclosure and abstention in the minutes.':'Stop: obtain disclosure and recuse before proceeding.');
  if(!Y('q_disc')) add(N('q_disc')?'High':'Medium','Disclosure not (confirmed) made','s.184(1)-(2); MBP-1','Written disclosure of interest at the Board meeting; entry in the register of contracts (s.189).','Make and minute the disclosure before the item is taken up.');
  if(!Y('q_abst')) add(N('q_abst')?'High':'Medium','Interested director may participate in vote','s.184(2) proviso','Interested director shall not participate; where all are interested, shareholder approval is needed.','Recuse the interested director; check quorum without them.');
 }
 if(a.q_int==='u'||a.q_rel==='u') add('Medium','Possible interest not verified','ss.184, 2(76)','Each director must examine direct/indirect interest.','Ask each director to confirm in writing.');
 if(Y('q_rpt')){
  add('Medium','Related-party transaction','s.188; s.177(4)(iv)','Board approval at a meeting (not by circulation); related director cannot vote; Audit Committee approval where applicable.','Place RPT on agenda with justification and terms.');
  if(!Y('q_alp')) add(N('q_alp')?'High':'Medium',N('q_alp')?'Not ordinary-course / arm\'s length':'Arm\'s length status unverified','s.188(1) (exemption lost)','Exemption from approvals applies only to ordinary-course, arm\'s-length deals; otherwise full approval route applies.','Obtain benchmarking / valuation to show arm\'s-length terms.');
  if(!Y('q_ac')) add(N('q_ac')?'High':'Medium','Audit Committee approval missing','s.177(4)(iv)','All RPTs require prior Audit Committee approval.','Refer to Audit Committee before Board vote.');
  if(Y('q_thr')&&!Y('q_sr')) add(N('q_sr')?'High':'Medium','Shareholder approval needed (threshold crossed)','s.188(1) proviso; Rule 15','Prior special resolution; related parties may not vote.','Convene general meeting / postal ballot; keep related parties out of voting.');
  if(a.q_thr==='u') add('Medium','Threshold test not done','Rule 15','Compare value with turnover / net worth limits.','Have finance compute the thresholds.');
  if(d.listed==='yes') add('Medium','Listed company: SEBI LODR applies','Reg. 23 SEBI (LODR) 2015','Additional approval/disclosure norms for material RPTs.','Check materiality and stock-exchange disclosure.');
 }
 if(a.q_rpt==='u') add('Medium','Related-party status not verified','s.2(76)','Check party against the related-party definition.','Check register of related parties.');
 if(Y('q_180')&&!Y('q_sr')) add('High','Special resolution of members required','s.180(1)','Board may act only with members\' special resolution.','Do not execute; seek shareholder approval first.');
 else if(a.q_180==='u') add('Medium','s.180 applicability unverified','s.180','Check if the item is a restricted power.','Ask the Company Secretary.');
 if(Y('q_loan')){
  const dirRel=['Director','Relative of director','Firm/company of director or relative'].includes(d.rel);
  add(dirRel?'High':'Medium',dirRel?'Loan/guarantee involving director or connected person':'Loan/investment limits apply',dirRel?'s.185':'s.186','s.185 restricts loans to directors/connected persons; s.186 sets limits and approval requirements.','Check limits, unanimous Board consent and special resolution requirements.');
 } else if(a.q_loan==='u') add('Medium','Loan/investment nature unverified','ss.185, 186','Check if it triggers loan/guarantee provisions.','Verify with legal.');
 gap('q_notice',{bad:'n',risk:'Medium'},'Short notice / agenda not circulated','s.173(3); SS-1','7 days\' notice with agenda and notes (shorter notice needs an independent director\'s presence).','Reschedule or confirm valid shorter-notice conditions.');
 gap('q_docs',{bad:'n',risk:'High'},'Information insufficient for decision','s.166(3)','Director must act with due and reasonable care, skill and diligence.','Defer until documents / valuation / advice are received.');
 gap('q_indep',{bad:'n',risk:'High'},'Independent judgment compromised','s.166(3)-(4)','Director must exercise independent judgment, avoid conflicts.','Record dissent or defer; seek independent advice.');
 if(Y('q_gain')) add('High','Undue gain or advantage','s.166(5); s.447','Director must not achieve undue gain for self/relatives/associates; may be liable to repay.','Do not approve; escalate to legal counsel.'); else if(a.q_gain==='u') add('Medium','Undue gain not verified','s.166(5)','Verify who benefits.','Confirm beneficiaries.');
 gap('q_care',{bad:'n',risk:'Medium'},'Due care not exercised','s.166(3)','Ask questions, review materials, take advice where needed.','Seek clarifications and record them in minutes.');
 gap('q_quorum',{bad:'n',risk:'High'},'Meeting/quorum validity','ss.173–174, 179','Decisions must be taken at a duly convened meeting with quorum.','Re-convene properly before relying on the decision.');
 if(!out.length) add('Low','No significant issue identified','—','Ordinary diligence and minuting.','Proceed; keep records. Human review still advised.');
 const lvl=out.some(o=>o.risk==='High')?'High':out.some(o=>o.risk==='Medium')?'Medium':'Low';
 const ord={High:0,Medium:1,Low:2};out.sort((x,y)=>ord[x.risk]-ord[y.risk]);
 return {lvl,alerts:out};
}

/* ---------- Scenarios ---------- */
const clean={q_int:'n',q_rel:'n',q_rpt:'n',q_180:'n',q_loan:'n',q_notice:'y',q_docs:'y',q_indep:'y',q_gain:'n',q_care:'y',q_quorum:'y'};
const SC=[
{n:'1. Routine office-supplies purchase (₹5 lakh, unrelated vendor)',exp:'Low',d:{title:'Office supplies',type:TYPES[0],val:5,party:'Unrelated vendor',rel:RELS[0],listed:'no'},a:{...clean}},
{n:'2. Contract with director\'s brother\'s firm, no disclosure',exp:'High',d:{title:'Consultancy contract',type:TYPES[3],val:80,party:'Brother\'s firm',rel:RELS[3],listed:'no'},a:{...clean,q_int:'y',q_rel:'y',q_disc:'n',q_abst:'n',q_rpt:'y',q_alp:'n',q_ac:'n',q_thr:'y',q_sr:'n'}},
{n:'3. Disclosed arm\'s-length RPT, approved, below threshold',exp:'Medium',d:{title:'IT services from group firm',type:TYPES[3],val:30,party:'Group firm',rel:RELS[3],listed:'no'},a:{...clean,q_int:'y',q_disc:'y',q_abst:'y',q_rpt:'y',q_alp:'y',q_ac:'y',q_thr:'n'}},
{n:'4. Sale of main undertaking without member approval',exp:'High',d:{title:'Sale of manufacturing unit',type:TYPES[5],val:5000,party:'Buyer Ltd',rel:RELS[0],listed:'no'},a:{...clean,q_180:'y',q_sr:'n',q_docs:'u',q_notice:'n'}},
{n:'5. Expansion plan with incomplete papers',exp:'Medium',d:{title:'New plant expansion',type:TYPES[6],val:900,party:'—',rel:RELS[0],listed:'no'},a:{...clean,q_docs:'u',q_notice:'n'}},
{n:'6. Loan to a company owned by director\'s relative',exp:'High',d:{title:'Inter-corporate loan',type:TYPES[2],val:200,party:'Relative\'s company',rel:RELS[3],listed:'no'},a:{...clean,q_int:'u',q_rel:'y',q_disc:'n',q_abst:'y',q_rpt:'y',q_alp:'u',q_ac:'n',q_thr:'u',q_loan:'y'}}
];

/* ---------- State & helpers ---------- */
let S={tab:'home',d:{type:TYPES[0],rel:RELS[0],listed:'no'},a:{},step:0,res:null,f:'All'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hist(){try{return JSON.parse(localStorage.getItem('dda_hist')||'[]')}catch(e){return[]}}
function saveHist(r){try{const h=hist();h.unshift({t:S.d.title,l:r.lvl,at:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})});localStorage.setItem('dda_hist',JSON.stringify(h.slice(0,10)))}catch(e){}}
const IC={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',book:'<path d="M5 4h13v16H7a2 2 0 01-2-2z"/><path d="M5 18V4"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11.5V16"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const TABS=[['home','Home','home'],['new','Check','check'],['duties','Duties','book'],['tests','Cases','list'],['guide','Guide','info'],['about','Limits','shield']];
const DISC='<div class="disc">⚠️ <b>Preliminary indicator only.</b> This tool assists but does not replace the director\'s own judgment, the Company Secretary, legal counsel or the Board\'s independent decision-making. It is not legal advice.</div>';
function go(t){S.tab=t;render()}
function fresh(){S.res=null;S.step=0;S.a={};S.d={type:TYPES[0],rel:RELS[0],listed:'no'}}
function hero(k,t,p,extra){return `<section class="hero"><div class="k">${k}</div><h1>${t}</h1><p>${p}</p>${extra||''}</section>`}
const pill=l=>`<span class="pill ${l}">${l}</span>`;

function render(){
 $('nav').innerHTML=TABS.map(([id,l,ic])=>`<button class="${S.tab===id?'on':''}" onclick="${id==='new'?'S.res||fresh();':''}go('${id}')">${svg(ic)}${l}</button>`).join('');
 const v={home,new:newView,duties,tests,guide,about}[S.tab];$('app').innerHTML=v();window.scrollTo(0,0);
}

/* Home */
function home(){
 const h=hist(),hi=h.filter(x=>x.l==='High').length,lo=h.length-hi;
 const tiles=[['n','#e8541e','📝','New Board Decision','Enter details & run checks','NEW'],['r','#2f56c9','📊','Legal Risk Assessment',S.res?'See latest result':'Run an assessment'],['a','#7a3fc4','🚨','Compliance Alerts',S.res?S.res.alerts.length+' alert(s) found':'See sample cases'],['d','#1f7a55','⚖️','Director Duties','s.166 & key provisions']];
 const act={n:"fresh();go('new')",r:"S.res?go('new'):(fresh(),go('new'))",a:"S.res?go('new'):go('tests')",d:"go('duties')"};
 return hero('Companies Act, 2013','Welcome, Director','Check a Board decision before you vote.',`<div class="row"><span class="pill acc">Conflict</span><span class="pill ghost">Related party</span><span class="pill ghost">Approvals</span><span class="pill ghost">Liability</span></div>`)
 +`<div class="status"><div><b>Your Decision Status</b><small>${h.length?h.length+' checked · '+hi+' high risk':'No decisions checked yet'}</small></div><div>${h.length?`<span class="pill Low">${lo} Cleared</span> <span class="pill ${hi?'High':'Low'}">${hi} High</span>`:'<span class="pill ghost">Start below</span>'}</div></div>`
 +`<div class="pad"><div class="grid">${tiles.map(t=>`<button class="tile" onclick="${act[t[0]]}"><i style="background:${t[1]}"></i>${t[5]?`<span class="new">${t[5]}</span>`:''}<span class="em">${t[2]}</span><b>${t[3]}</b><span class="s">${t[4]}</span></button>`).join('')}</div>
 <div class="lbl">Companies Act, 2013</div>
 <button class="banner" onclick="go('duties')"><span class="pill acc">KNOW YOUR DUTIES</span><h3>Your personal liability starts with s.166</h3><p>Good faith, due care, no undue gain → Tap to explore</p></button>
 <div class="lbl">Recent assessments</div>
 <div class="card">${h.length?h.map(x=>`<div class="li"><span class="dot ${x.l}"></span><div class="t"><b>${esc(x.t||'Untitled decision')}</b><small>${esc(x.at)}</small></div>${pill(x.l)}</div>`).join(''):'<div class="li"><div class="t"><b>Nothing here yet</b><small>Your last 10 checks appear here.</small></div></div>'}</div>
 ${DISC}</div>`;
}

/* Check */
const STEPS=['Entry','Conflict & Disclosure','Related Party & Approvals','Information & Judgment'];
const SECS=[null,'Conflict & Disclosure','Related Party & Approvals','Information & Judgment'];
function newView(){
 if(S.res) return resultView(S.res,S.d);
 const st=S.step;
 const head=hero('Step '+(st+1)+' of 4',st===0?'Board Decision Entry':SECS[st],st===0?'Tell us what the Board is deciding.':'Answer honestly. "Not sure" counts as a gap to verify.');
 const prog=`<div class="prog">${STEPS.map((x,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div><div class="stepname">${STEPS[st]}</div>`;
 if(st===0){const d=S.d;return head+`<div class="pad">${prog}<div class="card pd">
 <label for="f_title" style="margin-top:0">Decision / transaction title</label><input id="f_title" value="${esc(d.title)}" placeholder="e.g. Contract with ABC Pvt Ltd">
 <label for="f_type">Type</label><select id="f_type">${TYPES.map(x=>`<option ${x===d.type?'selected':''}>${x}</option>`).join('')}</select>
 <label for="f_val">Financial value (₹ lakh)</label><input id="f_val" type="number" inputmode="decimal" value="${esc(d.val)}" placeholder="e.g. 50">
 <label for="f_party">Party involved</label><input id="f_party" value="${esc(d.party)}" placeholder="e.g. ABC Pvt Ltd">
 <label for="f_rel">Relationship to the company / directors</label><select id="f_rel">${RELS.map(x=>`<option ${x===d.rel?'selected':''}>${x}</option>`).join('')}</select>
 <label for="f_listed">Is the company listed?</label><select id="f_listed"><option value="no" ${d.listed==='no'?'selected':''}>No</option><option value="yes" ${d.listed==='yes'?'selected':''}>Yes</option></select>
 <label for="f_purpose">Purpose / documents available</label><textarea id="f_purpose" rows="3">${esc(d.purpose)}</textarea>
 <button class="btn" onclick="saveEntry()">Next →</button></div></div>`}
 const qs=Q.filter(q=>q.sec===SECS[st]&&(!q.show||q.show(S.a)));
 return head+`<div class="pad">${prog}<div class="card pd">${qs.map(q=>`<div class="q"><p>${q.t}</p>${q.h?`<small>${q.h}</small>`:''}<div class="opts">${[['y','Yes'],['n','No'],['u','Not sure']].map(([v,l])=>`<button class="${S.a[q.id]===v?'on':''}" onclick="ans('${q.id}','${v}')">${l}</button>`).join('')}</div></div>`).join('')}
 <div id="err" class="err" role="alert"></div>
 <button class="btn" onclick="nextStep()">${st===3?'Run Legal Risk Assessment →':'Next →'}</button>
 <button class="btn sec" onclick="S.step--;render()">← Back</button></div></div>`;
}
function saveEntry(){const g=i=>$(i).value;S.d={title:g('f_title'),type:g('f_type'),val:g('f_val'),party:g('f_party'),rel:g('f_rel'),listed:g('f_listed'),purpose:g('f_purpose')};
 if(S.d.rel!==RELS[0]&&S.a.q_rpt===undefined) S.a.q_rpt='y'; S.step=1;render()}
function ans(id,v){S.a[id]=v;const y=window.scrollY;render();window.scrollTo(0,y)}
function nextStep(){
 const miss=Q.filter(q=>q.sec===SECS[S.step]&&(!q.show||q.show(S.a))&&!S.a[q.id]);
 if(miss.length){const e=$('err');if(e)e.textContent='Please answer all questions ('+miss.length+' left).';return}
 if(S.step<3){S.step++;render();return}
 const vis={};Q.forEach(q=>{if(!q.show||q.show(S.a))vis[q.id]=S.a[q.id]});
 S.res=evaluate(vis,S.d);saveHist(S.res);render();
}
function resultView(r,d){
 const msg=r.lvl==='Low'?'No significant issue identified.':r.lvl==='Medium'?'Further verification required.':'Potential legal / governance concern.';
 return `<section class="hero risk"><div class="k">Legal Risk Assessment</div><h1>${esc(d.title||'Board decision')}</h1><div class="row"><span class="pill big ${r.lvl}">${r.lvl.toUpperCase()} RISK</span></div><p style="margin-top:10px">${msg}</p></section>
 <div class="pad"><div class="lbl">Compliance recommendations · ${r.alerts.length}</div>
 <div class="card">${r.alerts.map(a=>`<div class="alert"><div class="h"><b>${esc(a.issue)}</b>${pill(a.risk)}</div><dl><dt>Provision</dt><dd>${esc(a.law)}</dd><dt>Requirement</dt><dd>${esc(a.req)}</dd><dt>Action</dt><dd>${esc(a.act)}</dd></dl></div>`).join('')}</div>
 ${DISC}
 <div><button class="btn" onclick="S.res=null;S.step=1;render()">Edit answers</button><button class="btn sec" onclick="fresh();render()">New decision</button></div></div>`;
}

/* Duties */
const DU=[['Duties','s.166(1)','Act in accordance with the articles of the company.'],
['Duties','s.166(2)','Act in good faith to promote the objects of the company for the benefit of members as a whole, and in the best interests of the company, its employees, shareholders, the community and the environment.'],
['Duties','s.166(3)','Exercise duties with due and reasonable care, skill and diligence, and independent judgment.'],
['Duties','s.166(4)','Avoid situations of direct or indirect conflict with the interests of the company.'],
['Duties','s.166(5)','Do not achieve or attempt undue gain or advantage for yourself, relatives, partners or associates. Any such gain can be recovered from you.'],
['Duties','s.166(6)','Do not assign your office as a director. Any assignment is void.'],
['Disclosure & RPT','s.184','Disclose your interest in a contract. An interested director must not take part in the discussion or vote.'],
['Disclosure & RPT','s.188','Related-party transactions need Board approval, and a special resolution above the Rule 15 thresholds.'],
['Disclosure & RPT','s.177(4)(iv)','The Audit Committee must approve related-party transactions.'],
['Meetings & Powers','ss.173–174','Board meetings need 7 days\' notice with agenda and notes, and a valid quorum.'],
['Meetings & Powers','ss.179–180','Some powers need a members\' special resolution, such as sale of an undertaking or borrowing beyond limits.'],
['Loans','ss.185–186','Loans to directors and connected persons are restricted. Loans, guarantees and investments have limits.'],
['Liability','s.166(7)','A director who contravenes s.166 is punishable with a fine. Check the Act for current amounts.'],
['Liability','s.447','Fraud attracts imprisonment and fines. Directors can be personally liable.']];
const CATS=['All','Duties','Disclosure & RPT','Meetings & Powers','Loans','Liability'];
function duties(){
 const L=DU.filter(x=>S.f==='All'||x[0]===S.f);
 return hero('Legal knowledge','Your duties as a director','What the Companies Act, 2013 expects of you.')
 +`<div class="pad"><div class="card dark"><h3 style="color:#fff">📜 Why this matters</h3><p>Directors owe duties to the company, not to any one promoter. A Board decision taken without checking conflicts, approvals and information can create <b>personal liability</b>.</p><div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill ghost">Good faith</span><span class="pill ghost">Due care</span><span class="pill ghost">Independent judgment</span><span class="pill ghost">No conflict</span></div></div>
 <div class="chips">${CATS.map(c=>`<button class="${S.f===c?'on':''}" onclick="S.f='${c}';render()">${c}</button>`).join('')}</div>
 ${L.map(x=>`<div class="dutycard"><div class="top"><span class="sec-pill">${x[1]}</span><span class="cat">${x[0]}</span></div><p>${x[2]}</p></div>`).join('')}
 <div class="disc">Also relevant: Companies (Meetings of Board and its Powers) Rules, 2014; Secretarial Standard SS-1; SEBI (LODR) Regulation 23 for listed companies. Check the latest amendments.</div></div>`;
}

/* Cases */
function tests(){
 const rows=SC.map((s,i)=>{const r=evaluate(s.a,s.d);return {s,i,r,ok:r.lvl===s.exp}});
 return hero('Scenario-based testing','Tested on '+SC.length+' Board decisions','Tap a case to load it and see the alerts.')
 +`<div class="pad"><div class="card">${rows.map(x=>`<div class="li click" onclick="loadSc(${x.i})"><span class="dot ${x.r.lvl}"></span><div class="t"><b>${esc(x.s.n)}</b><small>Expected ${x.s.exp} → App says ${x.r.lvl}</small></div>${pill(x.r.lvl)}<span>${x.ok?'✅':'❌'}</span></div>`).join('')}</div>
 <div class="card pd"><b>${rows.filter(x=>x.ok).length} of ${rows.length}</b> cases matched the expected risk level.</div></div>`;
}
function loadSc(i){const s=SC[i];S.d={...s.d};S.a={...s.a};const vis={};Q.forEach(q=>{if(!q.show||q.show(S.a))vis[q.id]=S.a[q.id]});S.res=evaluate(vis,S.d);S.tab='new';render()}

/* Guide */
const GS=[['📋','Board Decision','Put the item on the agenda with notes and supporting papers.','s.173(3) · 7 days\' notice'],['🔍','Conflict Check','Each director states any direct or indirect interest.','s.184 · Form MBP-1'],['📣','Disclosure','Interest is disclosed and minuted. The interested director steps out.','s.184(2)'],['🤝','Related Party','Test the party against s.2(76) and the Rule 15 thresholds.','s.188'],['✅','Approval','Audit Committee, Board and, if needed, a special resolution.','ss.177, 179, 180'],['📄','Information','Confirm papers, valuation and advice are enough to decide.','s.166(3)'],['🧠','Independent Judgment','Decide without pressure and without undue gain.','s.166(3)–(5)'],['📊','Risk Assessment','The app rates the decision Low, Medium or High.','Preliminary only'],['🧑‍⚖️','Compliance Action','Follow the suggested action and consult the Company Secretary or counsel.','Human oversight']];
const GD=[['📑','Board notice & agenda','Mandatory','m'],['✍️','Disclosure of interest (MBP-1)','Mandatory if interested','m'],['💹','Valuation / arm\'s-length report','Mandatory for related parties','m'],['🏛️','Audit Committee approval note','Mandatory for related parties','m'],['⚖️','Legal opinion','Optional','o']];
function guide(){
 return hero('Decision flowchart','From Board agenda to compliance action','Nine checks, in this order.')
 +`<div class="pad"><div class="lbl">Steps before you vote</div><div class="card">${GS.map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div><b>${x[0]} ${x[1]}</b><p>${x[2]}</p><em>${x[3]}</em></div></div>`).join('')}</div>
 <div class="lbl">Documents needed</div><div class="card">${GD.map(x=>`<div class="doc"><div class="ic">${x[0]}</div><div><b>${x[1]}</b><small class="${x[3]}">${x[3]==='m'?'✔ ':'○ '}${x[2]}</small></div></div>`).join('')}</div></div>`;
}

/* Limits */
function about(){
 let note='';try{note=localStorage.getItem('dda_note')||''}catch(e){}
 return hero('AI limitations & safeguards','AI assists. You decide.','What this app can and cannot do.')
 +`<div class="pad"><div class="card pd"><ul class="pl">
 <li><b>Accuracy:</b> a rule-based decision tree built on a reading of the Act. It can miss facts or nuances.</li>
 <li><b>Updated law:</b> thresholds, penalties and rules change. Check the latest amendments, notifications and case law.</li>
 <li><b>Confidentiality:</b> this app keeps only your last 10 result titles in your own browser. Do not enter confidential data into any online AI tool.</li>
 <li><b>Human oversight:</b> it does not replace the director, Company Secretary, legal counsel or the Board's independent decision.</li>
 <li><b>Professional advice:</b> results are preliminary indicators, not legal advice.</li></ul></div>
 <div class="lbl">Risk scale</div>
 <div class="card"><div class="li"><span class="dot Low"></span><div class="t"><b>Low</b><small>No significant issue identified</small></div>${pill('Low')}</div><div class="li"><span class="dot Medium"></span><div class="t"><b>Medium</b><small>Further verification required</small></div>${pill('Medium')}</div><div class="li"><span class="dot High"></span><div class="t"><b>High</b><small>Potential legal / governance concern</small></div>${pill('High')}</div></div>
 <div class="lbl">Creator's note</div>
 <div class="card pd"><label for="note" style="margin-top:0">Your reflection on turning Company Law into an app</label><textarea id="note" rows="5" placeholder="Write a short reflection…" oninput="try{localStorage.setItem('dda_note',this.value)}catch(e){}">${esc(note)}</textarea></div></div>`;
}

(async()=>{try{let seen=false;try{seen=localStorage.getItem('dda_seen')==='1'}catch(e){}
const base='https://api.counterapi.dev/v1/directorapp-krishna/visits';
const r=await fetch(seen?base:base+'/up');const j=await r.json();
